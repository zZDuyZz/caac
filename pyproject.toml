[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caac"
version = "0.2.0"
description = "Certified, compute-adaptive control of LLM reasoning (sample pool + offline replay)"
readme = "README.md"
requires-python = ">=3.10"   # CPU replay/analysis; GPU pool building needs >=3.11 (vLLM 0.32)
license = { text = "MIT" }
authors = [{ name = "[Student Name]" }]
keywords = ["llm", "reasoning", "test-time-compute", "selective-prediction", "learn-then-test"]

# Core = CPU-only offline replay, estimators, certification. numpy is all it needs.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Pool building on GPU (build_pool.py, extract_hidden.py). session2_setup.sh pins vllm.
gpu = [
    "torch",
    "transformers",
    "vllm==0.32.0",
]
# Benchmark loaders, the primary grader, parameter counting from the hub cache.
data = [
    "datasets",
    "math-verify==0.9.0",
    "huggingface_hub",
]
plot = ["matplotlib"]   # chow_frontier.py (use --no-plot without it)
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
